ShortDescription: The Open-Source, Privacy-First All-in-One PDF Workspace (100% In-Browser WASM)
Description: |-
  ErgonPDF is a sovereign, privacy-first all-in-one PDF workspace and document processing suite.
  Operating with 100% feature parity against PDF24, ErgonPDF processes all merges, splits, compressions,
  redactions, digital signatures, OCR, and heuristic document queries strictly inside local browser memory
  using WebAssembly and WebCrypto. Zero document bytes or telemetry ever leave the host machine.
