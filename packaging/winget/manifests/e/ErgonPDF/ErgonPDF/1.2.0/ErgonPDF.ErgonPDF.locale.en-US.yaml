ReleaseNotes: |-
  ErgonPDF v1.2.0 Release Highlights:
  - 100% feature parity across 126 PDF tools (PDF24 parity + digital signatures)
  - Full client-side execution via WebAssembly and WebCrypto (Zero cloud telemetry)
  - Sub-10ms mean engine operation latency (inspect, split, merge, stamp, compress)
  - Windows 1-click desktop deployment with local loopback daemon (127.0.0.1:8074)
  - Comprehensive 4-tier automated test suite: linting, 25-feature engine integrity, and 168-point smoke test
