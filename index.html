<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ErgonPDF is an open-source, privacy-first all-in-one PDF workspace. Merge, split, edit, compress, sign, OCR, and analyze documents locally in your browser with zero server uploads." />
    <meta property="og:title" content="ErgonPDF — The Open-Source, Privacy-First PDF Workspace" />
    <meta property="og:description" content="Merge, split, edit, compress, sign, OCR, and analyze documents locally in your browser with zero server uploads." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0f172a" />
    
    <!-- Offline-First Bundled Fonts: Instrument Serif, Plus Jakarta Sans, JetBrains Mono -->
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Zero-Flicker Theme Hydration -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('ergon_theme');
          var prefDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'light' || saved === 'dark' ? saved : (prefDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    
    <title>ErgonPDF — The Open-Source, Privacy-First PDF Workspace</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
